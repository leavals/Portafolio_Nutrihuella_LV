name: nutrihuella_mobile
description: App móvil Flutter con paridad funcional del frontend web de NutriHuella
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  event_bus: ^2.0.0
  flutter:
    sdk: flutter

  # Estado / Inyección
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # Red
  dio: ^5.7.0

  # Almacenamiento seguro del JWT
  flutter_secure_storage: ^9.2.2

  # Google Sign-In (idToken -> backend)
  google_sign_in: ^6.2.1

  # WebView para flujo Webpay
  webview_flutter: ^4.8.0

  # Env (.env) — mantiene compatibilidad
  flutter_dotenv: ^5.1.0

  # Utilidades UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
